name: JS port check

# The browser numerics must match their independent references: graph methods, Position 2 datasets,
# and the Position 3 agent protocol.
# tests/experiments.js reruns the page's Monte Carlo and spec grid and checks the numbers quoted in the dissertation
# (tests/fixtures/onedim_expected.json).

on:
  push:
    paths: ["js/onedim-core.js", "js/onedim.js", "js/p2-core.js", "js/p2.js", "js/p3-core.js", "js/p3-ui-core.js", "js/p3-agent-core.js", "js/p3.js", "js/p3-agent.js", "data/p2_datasets.json", "tests/**", ".github/workflows/port-check.yml"]
  pull_request:
    paths: ["js/onedim-core.js", "js/onedim.js", "js/p2-core.js", "js/p2.js", "js/p3-core.js", "js/p3-ui-core.js", "js/p3-agent-core.js", "js/p3.js", "js/p3-agent.js", "data/p2_datasets.json", "tests/**", ".github/workflows/port-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/port_check.js
      - run: node tests/experiments.js --check
      - run: node tests/p2_check.js
      - run: node tests/p3_check.js
      - run: node tests/p3_ui_check.js
      - run: node tests/p3_agent_check.js
      - run: node --check js/p2.js
      - run: node --check js/p3.js
      - run: node --check js/p3-ui-core.js
      - run: node --check js/p3-agent-core.js
      - run: node --check js/p3-agent.js
